name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download ffmpeg
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # GPL build from BtbN/FFmpeg-Builds. Satsuma runs it as a separate program, it isn't linked in.
          # The file names change with every FFmpeg release, so grab the newest stable one instead of hard-coding it.
          $release = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest" `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $asset = $release.assets |
            Where-Object name -Match '^ffmpeg-n(\d+(\.\d+)*)-latest-win64-gpl-[\d.]+\.zip$' |
            Sort-Object { [version]($_.name -replace '^ffmpeg-n([\d.]+)-.*$', '$1') } -Descending |
            Select-Object -First 1
          if (-not $asset) { $asset = $release.assets | Where-Object name -EQ 'ffmpeg-master-latest-win64-gpl.zip' }
          Write-Host "Using $($asset.name)"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest $asset.browser_download_url -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          $bin = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory tools -Force | Out-Null
          Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName ffprobe.exe) tools
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName tools\FFMPEG-LICENSE.txt
          "SATSUMA_FFMPEG=$PWD\tools\ffmpeg.exe" >> $env:GITHUB_ENV

      - name: Test core
        run: dotnet test --project tests/Satsuma.Core.Tests -c Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Satsuma.App -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish
          New-Item -ItemType Directory publish\tools -Force | Out-Null
          Copy-Item tools\* publish\tools
          Copy-Item README.md publish

      - name: Which self-test group crashes on exit (temporary)
        shell: pwsh
        continue-on-error: true
        run: |
          Remove-Item Env:SATSUMA_FFMPEG
          $all = 'image', 'pdf', 'pdfsharp', 'media', 'wheel', 'hook', 'hud', 'tray'
          $runs = @()
          for ($i = 1; $i -le $all.Count; $i++) { $runs += ($all[0..($i - 1)] -join ',') }
          foreach ($skip in $all) { $runs += (($all | Where-Object { $_ -ne $skip }) -join ',') }
          $n = 0
          foreach ($groups in $runs) {
            $n++
            $p = Start-Process publish\Satsuma.exe -ArgumentList "--self-test", "`"$env:RUNNER_TEMP\diag-$n`"", $groups -PassThru
            $null = $p.Handle
            $p.WaitForExit()
            Write-Host "[$groups] -> exit $($p.ExitCode)"
          }

      - name: Self-test on Windows
        shell: pwsh
        run: |
          # Make the published app use its own bundled ffmpeg, not the one the tests used.
          Remove-Item Env:SATSUMA_FFMPEG
          $out = "$PWD\self-test"
          $p = Start-Process publish\Satsuma.exe -ArgumentList "--self-test", "`"$out`"" -PassThru
          $null = $p.Handle # without this PowerShell sometimes loses the exit code
          $p.WaitForExit()
          Get-Content "$out\self-test.log"
          Write-Host "Exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - uses: actions/upload-artifact@v5
        with:
          name: Satsuma-win-x64
          path: publish

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: self-test
          path: self-test

  # Push a tag like v0.1.0 and this turns the build into a GitHub Release with a zip people can download.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Satsuma-win-x64
          path: Satsuma

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_name="Satsuma-${GITHUB_REF_NAME}-win-x64.zip"
          (cd Satsuma && zip -qr "../$zip_name" .)
          gh release create "$GITHUB_REF_NAME" "$zip_name" --repo "$GITHUB_REPOSITORY" \
            --title "Satsuma $GITHUB_REF_NAME" --generate-notes
