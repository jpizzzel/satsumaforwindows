name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # The website deploys on Vercel by itself, so changes to it don't need a Windows build.
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']
  # The Run workflow button on the Actions tab. Fill in a version like v0.2.0 to publish a release from it.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like v0.2.0. Leave empty for a plain build.
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The release tag: either the pushed tag, or the version typed into the Run workflow button.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download ffmpeg
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # GPL build from BtbN/FFmpeg-Builds. Satsuma runs it as a separate program, it isn't linked in.
          # The file names change with every FFmpeg release, so grab the newest stable one instead of hard-coding it.
          $release = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest" `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $asset = $release.assets |
            Where-Object name -Match '^ffmpeg-n(\d+(\.\d+)*)-latest-win64-gpl-[\d.]+\.zip$' |
            Sort-Object {
              # A version like n8 has no dot, and [version] needs at least two parts.
              $v = $_.name -replace '^ffmpeg-n([\d.]+)-.*$', '$1'
              if ($v -notmatch '\.') { $v += '.0' }
              [version]$v
            } -Descending |
            Select-Object -First 1
          if (-not $asset) { $asset = $release.assets | Where-Object name -EQ 'ffmpeg-master-latest-win64-gpl.zip' }
          if (-not $asset) { throw "No ffmpeg build found in BtbN/FFmpeg-Builds latest release" }
          Write-Host "Using $($asset.name)"
          "FFMPEG_ASSET=$($asset.name)" >> $env:GITHUB_ENV
          "FFMPEG_URL=$($asset.browser_download_url)" >> $env:GITHUB_ENV
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest $asset.browser_download_url -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          $bin = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory tools -Force | Out-Null
          # ffprobe is only for the tests. The download doesn't ship it.
          Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName ffprobe.exe) tools
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName tools\FFMPEG-LICENSE.txt
          "SATSUMA_FFMPEG=$PWD\tools\ffmpeg.exe" >> $env:GITHUB_ENV

      - name: Test core
        run: dotnet test --project tests/Satsuma.Core.Tests -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.TrimStart('v') } else { '0.0.0-dev' }
          Write-Host "Version $version"
          dotnet publish src/Satsuma.App -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
            -p:Version=$version -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory publish\tools -Force | Out-Null
          Copy-Item tools\ffmpeg.exe, tools\FFMPEG-LICENSE.txt publish\tools
          $ffmpegVersion = (& publish\tools\ffmpeg.exe -hide_banner -version | Select-Object -First 1)
          @(
            "Build: $env:FFMPEG_ASSET"
            "Downloaded from: $env:FFMPEG_URL"
            "Version: $ffmpegVersion"
            ""
            "This is an unmodified GPL build from https://github.com/BtbN/FFmpeg-Builds."
            "Source code: https://ffmpeg.org and https://github.com/BtbN/FFmpeg-Builds"
          ) | Set-Content publish\tools\FFMPEG-VERSION.txt -Encoding utf8
          Get-Content publish\tools\FFMPEG-VERSION.txt
          # Magick.NET's notice file has the ImageMagick license and the licenses of the libraries bundled with it.
          $notice = Get-ChildItem "$env:USERPROFILE\.nuget\packages\magick.net-q8-anycpu" -Recurse -Filter Notice.txt |
            Select-Object -First 1
          if (-not $notice) { throw "Magick.NET Notice.txt not found in the NuGet cache" }
          Copy-Item $notice.FullName publish\MAGICK-NET-NOTICE.txt
          Copy-Item README.md, THIRD-PARTY-NOTICES.md publish

      - name: Self-test on Windows
        shell: pwsh
        run: |
          # If it crashes, have Windows keep a dump so the next step can show where.
          $dumps = "$PWD\dumps"
          New-Item -ItemType Directory $dumps -Force | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Satsuma.exe'
          New-Item $key -Force | Out-Null
          Set-ItemProperty $key DumpFolder $dumps
          Set-ItemProperty $key DumpType 1
          # Make the published app use its own bundled ffmpeg, not the one the tests used.
          Remove-Item Env:SATSUMA_FFMPEG
          $out = "$PWD\self-test"
          $p = Start-Process publish\Satsuma.exe -ArgumentList "--self-test", "`"$out`"" -PassThru
          $null = $p.Handle # without this PowerShell sometimes loses the exit code
          $p.WaitForExit()
          Get-Content "$out\self-test.log" -ErrorAction Continue
          Write-Host "Exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Show the crash stack
        if: failure()
        shell: pwsh
        run: |
          $dump = Get-ChildItem dumps -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 1
          $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue
          if (-not $dump) { Write-Host "No crash dump was written."; exit 0 }
          if (-not $cdb) { Write-Host "cdb isn't installed, so only the dump is uploaded."; exit 0 }
          & $cdb.FullName -z $dump.FullName -c ".symfix; .reload; .ecxr; kn 40; !analyze -v; q" | Select-Object -Last 150

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: crash-dump
          path: dumps

      - uses: actions/upload-artifact@v5
        with:
          name: Satsuma-win-x64
          path: publish

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: self-test
          path: self-test

  # Push a tag like v0.1.0 and this turns the build into a GitHub Release with a zip people can download.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Satsuma-win-x64
          path: Satsuma

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_name="Satsuma-${RELEASE_TAG}-win-x64.zip"
          rm -f "$zip_name"
          (cd Satsuma && zip -qr "../$zip_name" .)
          # Re-running this job is safe: if the release already exists, just replace the zip.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$zip_name" --repo "$GITHUB_REPOSITORY" --clobber
          else
            ffmpeg_build="$(sed -n 's/^Build: //p' Satsuma/tools/FFMPEG-VERSION.txt)"
            printf '%s\n' \
              "The zip includes an unmodified GPL build of FFmpeg ($ffmpeg_build) in the tools folder." \
              "You can get its source from the FFmpeg project (https://ffmpeg.org) and BtbN/FFmpeg-Builds (https://github.com/BtbN/FFmpeg-Builds). FFMPEG-VERSION.txt in the tools folder names the exact build." \
              > notes.md
            gh release create "$RELEASE_TAG" "$zip_name" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Satsuma $RELEASE_TAG" --notes-file notes.md --generate-notes
          fi
